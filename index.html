<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoUltra — Онлайн кинотеатр</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23e50914%22/><text x=%2250%%22 y=%2254%%22 font-size=%2268%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-family=%22Arial, sans-serif%22>K</text></svg>">
    <style>
        :root {
            --bg: #0b0c10;
            --card-bg: #1f2833;
            --accent: #e50914;
            --text: #ffffff;
            --text-gray: #c5c6c7;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #12141d;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
            cursor: pointer;
        }
        nav {
            display: flex;
            gap: 10px;
        }
        nav button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        nav button:hover, nav button.active {
            background: var(--accent);
            border-color: var(--accent);
        }
        .search-box input {
            padding: 10px 18px;
            width: 240px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #1a1c24;
            color: white;
            outline: none;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .ad-box {
            margin-bottom: 25px;
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-5px); }
        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }
        .card-info { padding: 10px; }
        .card-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { font-size: 12px; color: var(--text-gray); margin-top: 5px; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-content {
            background: #151720;
            width: 850px;
            max-width: 100%;
            border-radius: 10px;
            padding: 20px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        .close {
            position: absolute;
            top: 10px; right: 15px;
            color: var(--text-gray);
            font-size: 28px;
            cursor: pointer;
        }
        .close:hover { color: white; }
        .player-frame {
            width: 100%;
            height: 450px;
            background: #000;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
        }
        .servers {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .server-btn {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .server-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="loadCategory('popular')">KinoUltra</div>
        <nav>
            <button class="active" id="btn-popular" onclick="loadCategory('popular')">Популярное</button>
            <button id="btn-russian" onclick="loadCategory('russian')">Русское кино</button>
            <button id="btn-anime" onclick="loadCategory('anime')">Аниме</button>
        </nav>
        <div class="search-box">
            <input type="text" placeholder="Поиск..." onkeydown="if(event.key==='Enter') searchMovie(this.value)">
        </div>
    </header>

    <div class="container">
        <!-- Нативный баннер Adsterra -->
        <div class="ad-box">
            <script async="async" data-cfasync="false" src="https://bancadeltempoidea.org/21/5e3bed81d838ac1ae8d3b4a0282ef918"></script>
            <div id="container-5e3bed81d838ac1ae8d3b4a0282ef918"></div>
        </div>

        <h2 id="sectionTitle">Популярные фильмы</h2>
        <div class="grid" id="movieGrid">Загрузка...</div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
