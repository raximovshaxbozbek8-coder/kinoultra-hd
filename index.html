<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="google-site-verification" content="fNl9QEdvjZOO-HoHmPcxZNIFtOfWZEE2euZz_bybCu0" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoUltra — Смотреть фильмы, русское кино и аниме онлайн</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23e50914%22/><text x=%2250%%22 y=%2254%%22 font-size=%2268%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-family=%22Arial, sans-serif%22>K</text></svg>">
    
    <style>
        :root {
            --bg: #0f1015;
            --card-bg: #1a1c24;
            --accent: #e50914;
            --accent-hover: #b20710;
            --text: #ffffff;
            --text-sub: #9ca3af;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #15161d;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: var(--accent);
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        nav {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        nav button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }

        nav button:hover, nav button.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .search-box input {
            padding: 10px 18px;
            width: 260px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #222;
            color: white;
            outline: none;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent);
        }

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .native-ad-wrapper {
            margin-bottom: 25px;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .card-info { padding: 12px; }
        .card-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { font-size: 12px; color: var(--text-sub); margin-top: 6px; display: flex; justify-content: space-between; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: #151720;
            width: 900px;
            max-width: 100%;
            border-radius: 14px;
            padding: 25px;
            position: relative;
            max-height: 92vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .close {
            position: absolute;
            top: 15px; right: 20px;
            color: var(--text-sub);
            font-size: 32px;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }

        .close:hover { color: white; }

        .movie-info-box {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .modal-poster {
            width: 160px;
            height: 240px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .modal-details {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .play-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-top: 15px;
        }

        .play-btn:hover { background: var(--accent-hover); }

        .player-container {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            min-height: 450px;
        }

        .reviews-section {
            margin-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }
        .star-rating {
            display: flex;
            gap: 5px;
            font-size: 24px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .star { color: #555; transition: color 0.2s; }
        .star.active { color: #f59e0b; }
        .review-input {
            width: 100%;
            padding: 12px;
            background: #1e2029;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            resize: vertical;
            min-height: 70px;
            margin-bottom: 10px;
            outline: none;
            font-family: inherit;
        }
        .review-input:focus { border-color: var(--accent); }
        .review-btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .review-btn:hover { background: var(--accent); }
        .reviews-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .review-item {
            background: #1e2029;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
        }
        .review-item-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-sub);
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="loadCategory('popular')">KinoUltra</div>
        
        <nav>
            <button class="active" id="btn-popular" onclick="loadCategory('popular')">🔥 Популярное</button>
            <button id="btn-russian" onclick="loadCategory('russian')">🇷🇺 Русское кино</button>
            <button id="btn-anime" onclick="loadCategory('anime')">⛩️ Аниме</button>
        </nav>

        <div class="search-box">
            <input type="text" placeholder="Поиск фильмов и аниме..." onkeydown="if(event.key==='Enter') searchMovie(this.value)">
        </div>
    </header>

    <div class="container">
        <!-- Нативный баннер Adsterra -->
        <div class="native-ad-wrapper">
            <script async="async" data-cfasync="false" src="https://bancadeltempoidea.org/21/5e3bed81d838ac1ae8d3b4a0282ef918"></script>
            <div id="container-5e3bed81d838ac1ae8d3b4a0282ef918"></div>
        </div>

        <h2 id="sectionTitle">🔥 Популярные фильмы</h2>
        <div class="grid" id="movieGrid">Загрузка каталога...</div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
