<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="google-site-verification" content="fNl9QEdvjZOO-HoHmPcxZNIFtOfWZEE2euZz_bybCu0" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoUltra — Смотреть фильмы, русское кино и аниме онлайн бесплатно</title>
    <!-- Красная иконка с буквой K для вкладки браузера -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23e50914%22/><text x=%2250%%22 y=%2254%%22 font-size=%2268%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-family=%22Arial, sans-serif%22>K</text></svg>">
    
    <style>
        :root {
            --bg: #0f1015;
            --card-bg: #1a1c24;
            --accent: #e50914;
            --accent-hover: #b20710;
            --text: #ffffff;
            --text-sub: #9ca3af;
            --ad-bg: #1e2029;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #15161d;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
            cursor: pointer;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        nav button:hover, nav button.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .search-box input {
            padding: 10px 18px;
            width: 260px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #222;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .ad-banner {
            background: var(--ad-bg);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 20px;
            font-size: 13px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .card:hover { transform: translateY(-5px); }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .card-info { padding: 10px; }
        .card-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { font-size: 12px; color: var(--text-sub); margin-top: 5px; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #181922;
            width: 880px;
            max-width: 95%;
            border-radius: 12px;
            padding: 24px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close {
            position: absolute;
            top: 10px; right: 18px;
            color: var(--text-sub);
            font-size: 32px;
            cursor: pointer;
            line-height: 1;
        }

        .close:hover { color: white; }

        .movie-info-box {
            display: flex;
            gap: 20px;
        }

        .modal-poster {
            width: 160px;
            height: 240px;
            object-fit: cover;
            border-radius: 8px;
        }

        .modal-details {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .play-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-top: 15px;
        }

        .play-btn:hover { background: var(--accent-hover); }

        iframe {
            width: 100%;
            height: 480px;
            border: none;
            border-radius: 8px;
            background: #000;
        }

        /* Стили для системы отзывов и звёзд */
        .reviews-section {
            margin-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }
        .star-rating {
            display: flex;
            gap: 5px;
            font-size: 24px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .star { color: #555; transition: color 0.2s; }
        .star.active { color: #f59e0b; }
        .review-input {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #333;
            border-radius: 6px;
            color: white;
            resize: vertical;
            min-height: 60px;
            margin-bottom: 10px;
            outline: none;
        }
        .review-btn {
            background: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .review-btn:hover { background: var(--accent); }
        .reviews-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .review-item {
            background: #1e2029;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
        }
        .review-item-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
    </style>

    <script data-cfasync="false" src="https://aarems.org/1/fc63adad21599d5019e3641c3dda462d"></script>
</head>
<body>

    <header>
        <div class="logo" onclick="loadCategory('popular')">KinoUltra</div>
        
        <!-- КНОПКИ РАЗДЕЛОВ НА РУССКОМ -->
        <nav>
            <button class="active" onclick="loadCategory('popular')">🔥 Популярное</button>
            <button onclick="loadCategory('russian')">🇷🇺 Русское кино</button>
            <button onclick="loadCategory('anime')">⛩️ Аниме</button>
        </nav>

        <div class="search-box">
            <input type="text" placeholder="Поиск фильмов и аниме..." onkeydown="if(event.key==='Enter') searchMovie(this.value)">
        </div>
    </header>

    <div class="container">
        <!-- БЛОК РЕКЛАМЫ #1: Верхний баннер -->
        <div class="ad-banner" id="topAdSlot">
            <span>📢 Рекламный блок (728x90)</span>
        </div>

        <h2 id="sectionTitle">Популярное кино</h2>
        <div class="grid" id="movieGrid">Загрузка каталога...</div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const API_KEY = '3fd2be6f0c70a2a598f084ddfb75487c';
        let moviesList = [];
        let currentSelectedRating = 5;

        // Загрузка фильмов на русском языке
        async function loadMovies(url, title = "Популярное кино") {
            document.getElementById('sectionTitle').innerText = title;
            try {
                const res = await fetch(url);
                const data = await res.json();
                moviesList = data.results || [];
                render(moviesList);
            } catch (e) {
                document.getElementById('movieGrid').innerText = "Ошибка загрузки каталога.";
            }
        }

        // Переключение категорий (Популярное, Русское кино, Аниме)
        function loadCategory(type) {
            if (type === 'popular') {
                loadMovies(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=ru-RU`, "🔥 Популярные фильмы");
            } else if (type === 'russian') {
                loadMovies(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&language=ru-RU&with_original_language=ru&sort_by=popularity.desc`, "🇷🇺 Русское кино и сериалы");
            } else if (type === 'anime') {
                loadMovies(`https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&language=ru-RU&with_genres=16&with_original_language=ja&sort_by=popularity.desc`, "⛩️ Популярное Аниме");
            }
        }

        async function searchMovie(q) {
            if(!q) return loadCategory('popular');
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&language=ru-RU&query=${encodeURIComponent(q)}`);
            const data = await res.json();
            moviesList = data.results || [];
            document.getElementById('sectionTitle').innerText = `Результаты поиска: "${q}"`;
            render(moviesList);
        }

        function render(list) {
            const grid = document.getElementById('movieGrid');
            if (list.length === 0) {
                grid.innerHTML = '<div>Ничего не найдено.</div>';
                return;
            }
            grid.innerHTML = list.map(m => {
                const title = m.title || m.name || 'Без названия';
                const date = (m.release_date || m.first_air_date || '').split('-')[0];
                const rating = m.vote_average ? m.vote_average.toFixed(1) : '0';
                return `
                    <div class="card" onclick="openInfo(${m.id})">
                        <img src="${m.poster_path ? 'https://image.tmdb.org/t/p/w500' + m.poster_path : 'https://via.placeholder.com/300x450'}" alt="${title}">
                        <div class="card-info">
                            <div class="card-title">${title}</div>
                            <div class="card-meta">${date} • ★ ${rating}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openInfo(id) {
            const m = moviesList.find(item => item.id === id);
            if (!m) return;

            const poster = m.poster_path ? 'https://image.tmdb.org/t/p/w500' + m.poster_path : '';
            const title = m.title || m.name;
            const desc = m.overview || "Описание отсутствует.";
            const isTv = m.first_air_date ? 'tv' : 'movie';

            document.getElementById('modalBody').innerHTML = `
                <h2 style="margin-top:0;">${title}</h2>
                <div class="movie-info-box">
                    <img class="modal-poster" src="${poster}" alt="${title}">
                    <div class="modal-details">
                        <p style="color:#9ca3af; line-height:1.4;">${desc}</p>
                        <button class="play-btn" onclick="startMovie(${m.id}, '${title.replace(/'/g, "")}', '${isTv}')">Смотреть онлайн</button>
                    </div>
                </div>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        // Запуск плеера без ошибки 404
        function startMovie(id, title, type = 'movie') {
            // Исправление: для ТВ-шоу и аниме указываем 1 сезон и 1 серию (/1/1), чтобы не было 404
            let playerUrl = type === 'tv' 
                ? `https://vidlink.pro/tv/${id}/1/1?primaryColor=e50914&multiStream=true`
                : `https://vidlink.pro/movie/${id}?primaryColor=e50914&multiStream=true`;

            document.getElementById('modalBody').innerHTML = `
                <h3 style="margin-top:0; margin-bottom:12px;">${title}</h3>
                
                <!-- ПЛЕЕР -->
                <iframe src="${playerUrl}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
                
                <!-- БЛОК РЕКЛАМЫ #2: Баннер под видеоплеером -->
                <div class="ad-banner" style="margin-top:15px; margin-bottom:0;">
                    <span>📺 Спонсорский баннер / Реклама под плеером</span>
                </div>

                <!-- БЛОК ОТЗЫВОВ И ЗВЁЗД -->
                <div class="reviews-section">
                    <h4>Оставить отзыв и оценку</h4>
                    <div class="star-rating" id="starContainer">
                        <span class="star active" onclick="setRating(1)">★</span>
                        <span class="star active" onclick="setRating(2)">★</span>
                        <span class="star active" onclick="setRating(3)">★</span>
                        <span class="star active" onclick="setRating(4)">★</span>
                        <span class="star active" onclick="setRating(5)">★</span>
                    </div>
                    <textarea class="review-input" id="reviewText" placeholder="Напишите ваше мнение о фильме или аниме..."></textarea>
                    <button class="review-btn" onclick="submitReview(${id})">Отправить отзыв</button>
                    
                    <div class="reviews-list" id="reviewsListContainer">
                        <!-- Сюда подгружаются отзывы -->
                    </div>
                </div>
            `;
            loadReviews(id);
        }

        function setRating(rating) {
            currentSelectedRating = rating;
            const stars = document.querySelectorAll('#starContainer .star');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function submitReview(movieId) {
            const text = document.getElementById('reviewText').value.trim();
            if (!text) return alert('Напишите текст отзыва!');

            const reviewsKey = 'reviews_' + movieId;
            const existingReviews = JSON.parse(localStorage.getItem(reviewsKey) || '[]');

            const newReview = {
                rating: currentSelectedRating,
                text: text,
                date: new Date().toLocaleDateString()
            };

            existingReviews.unshift(newReview);
            localStorage.setItem(reviewsKey, JSON.stringify(existingReviews));

            document.getElementById('reviewText').value = '';
            loadReviews(movieId);
        }

        function loadReviews(movieId) {
            const reviewsKey = 'reviews_' + movieId;
            const reviews = JSON.parse(localStorage.getItem(reviewsKey) || '[]');
            const container = document.getElementById('reviewsListContainer');

            if (reviews.length === 0) {
                container.innerHTML = '<div style="color:var(--text-sub); font-size:12px;">Пока нет отзывов. Будьте первыми!</div>';
                return;
            }

            container.innerHTML = reviews.map(r => `
                <div class="review-item">
                    <div class="review-item-header">
                        <span>Оценка: ${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                        <span>${r.date}</span>
                    </div>
                    <div>${r.text}</div>
                </div>
            `).join('');
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modalBody').innerHTML = '';
        }

        // Запуск по умолчанию
        loadCategory('popular');
    </script>
    <script data-cfasync="false" src="https://bancadeltempoidea.org/14/eba8d4d2487e475023c1c30825def61d"></script>
</body>
</html>
