<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoUltra — Онлайн кинотеатр</title>
    <!-- Favicon (иконка во вкладке браузера) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e50914'><path d='M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z'/></svg>">
    
    <!-- Встроенные стили CSS -->
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent: #e50914;
            --text-main: #ffffff;
            --text-gray: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .logo-icon {
            filter: drop-shadow(0 0 8px rgba(229, 9, 20, 0.6));
            transition: transform 0.3s ease;
        }

        .logo:hover .logo-icon {
            transform: scale(1.1) rotate(-5deg);
        }

        .logo .highlight {
            color: var(--accent);
        }

        .search-box {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            outline: none;
        }

        .search-box button {
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-box button:hover {
            opacity: 0.9;
        }

        /* Навигация */
        nav {
            display: flex;
            gap: 12px;
            padding: 15px 5%;
            background: #12141d;
            overflow-x: auto;
        }

        nav button {
            background: transparent;
            color: var(--text-gray);
            border: none;
            padding: 8px 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            white-space: nowrap;
            transition: 0.2s;
        }

        nav button.active, nav button:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }

        /* Основной контент */
        main {
            padding: 25px 5%;
            flex: 1;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .card img {
            width: 100%;
            height: 270px;
            object-fit: cover;
        }

        .card-info {
            padding: 12px;
        }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-gray);
            margin-top: 6px;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #161922;
            width: 100%;
            max-width: 900px;
            border-radius: 16px;
            padding: 24px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-gray);
        }

        .close-btn:hover { color: #fff; }

        /* Отзывы */
        .reviews-section {
            margin-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }

        .star-rating {
            display: flex;
            gap: 5px;
            font-size: 20px;
            cursor: pointer;
            color: #444;
            margin-bottom: 12px;
        }

        .star-rating .star.active { color: #ffc107; }

        .review-input {
            width: 100%;
            height: 80px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            resize: none;
            outline: none;
            margin-bottom: 10px;
        }

        .review-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .reviews-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .review-item {
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        .review-item-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-gray);
            font-size: 12px;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <div class="logo" onclick="loadCategory('popular')">
            <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#e50914" width="32" height="32">
                <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>
            </svg>
            <span>KINO<span class="highlight">ULTRA</span></span>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск фильмов, сериалов, аниме..." onkeyup="if(event.key === 'Enter') searchMovie(this.value)">
            <button onclick="searchMovie(document.getElementById('searchInput').value)">Поиск</button>
        </div>
    </header>

    <!-- Навигация -->
    <nav>
        <button id="btn-popular" class="active" onclick="loadCategory('popular')">🔥 Популярные</button>
        <button id="btn-russian" onclick="loadCategory('russian')">🇷🇺 Русское кино</button>
        <button id="btn-anime" onclick="loadCategory('anime')">⛩️ Аниме</button>
    </nav>

    <!-- Главный контент -->
    <main>
        <h2 id="sectionTitle">🔥 Популярные фильмы</h2>
        <div id="movieGrid" class="grid"></div>
    </main>

    <!-- Модальное окно с плеером -->
    <div id="modal" class="modal" onclick="if(event.target === this) closeModal()">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Встроенная логика JavaScript -->
    <script>
        const API_KEY = '8baba8ab6b8bbe247645bcae7df63d0d';
        let moviesList = [];
        let currentSelectedRating = 5;

        // Динамическая подгрузка рекламы Adsterra
        function injectAdScript() {
            if (!document.getElementById('adsterra-script')) {
                const script = document.createElement('script');
                script.id = 'adsterra-script';
                script.src = 'https://bancadeltempoidea.org/21/5e3bed81d838ac1ae8d3b4a0282ef918.js';
                script.async = true;
                document.head.appendChild(script);
            }
        }
        injectAdScript();

        // Загрузка официального JS-движка Kinobox
        function loadKinoboxScript(callback) {
            if (window.Kinobox) {
                callback();
                return;
            }
            const script = document.createElement('script');
            script.src = 'https://kinobox.in/kinobox.min.js';
            script.async = true;
            script.onload = callback;
            document.head.appendChild(script);
        }

        async function fetchTMDB(endpoint) {
            try {
                const separator = endpoint.includes('?') ? '&' : '?';
                const res = await fetch(`https://api.themoviedb.org/3${endpoint}${separator}api_key=${API_KEY}&language=ru-RU`);
                if (res.ok) return await res.json();
            } catch (e) {
                console.error("Ошибка TMDB:", e);
            }
            return null;
        }

        async function loadMovies(endpoint, title = "Фильмы") {
            document.getElementById('sectionTitle').innerText = title;
            document.getElementById('movieGrid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">Загрузка каталога...</div>';
            
            const data = await fetchTMDB(endpoint);
            if (data && data.results && data.results.length > 0) {
                moviesList = data.results;
                render(moviesList);
            } else {
                document.getElementById('movieGrid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #f55; padding: 40px;">Не удалось загрузить данные.</div>';
            }
        }

        function loadCategory(type) {
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            if (type === 'popular') {
                document.getElementById('btn-popular')?.classList.add('active');
                loadMovies('/movie/popular', "🔥 Популярные фильмы");
            } else if (type === 'russian') {
                document.getElementById('btn-russian')?.classList.add('active');
                loadMovies('/discover/movie?with_original_language=ru&sort_by=popularity.desc', "🇷🇺 Русское кино");
            } else if (type === 'anime') {
                document.getElementById('btn-anime')?.classList.add('active');
                loadMovies('/discover/tv?with_genres=16&with_original_language=ja&sort_by=popularity.desc', "⛩️ Популярное Аниме");
            }
        }

        async function searchMovie(q) {
            if (!q) return loadCategory('popular');
            document.getElementById('sectionTitle').innerText = `Поиск: "${q}"`;
            document.getElementById('movieGrid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px;">Поиск...</div>';
            
            const data = await fetchTMDB(`/search/multi?query=${encodeURIComponent(q)}`);
            if (data && data.results && data.results.length > 0) {
                moviesList = data.results.filter(item => item.media_type === 'movie' || item.media_type === 'tv');
                render(moviesList);
            } else {
                document.getElementById('movieGrid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #9ca3af; padding: 40px;">По вашему запросу ничего не найдено.</div>';
            }
        }

        function render(list) {
            const grid = document.getElementById('movieGrid');
            if (!list || list.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px;">Ничего не найдено</div>';
                return;
            }
            grid.innerHTML = list.map(m => {
                const title = m.title || m.name || 'Без названия';
                const date = (m.release_date || m.first_air_date || '').split('-')[0];
                const rating = m.vote_average ? m.vote_average.toFixed(1) : '0';
                const poster = m.poster_path ? 'https://image.tmdb.org/t/p/w500' + m.poster_path : 'https://via.placeholder.com/300x450?text=Нет+обложки';
                const isTv = m.media_type === 'tv' || !m.title;
                return `
                    <div class="card" onclick="openPlayer(${m.id}, '${title.replace(/'/g, "")}', ${isTv})">
                        <img src="${poster}" alt="${title}" loading="lazy">
                        <div class="card-info">
                            <div class="card-title">${title}</div>
                            <div class="card-meta"><span>${date}</span><span>★ ${rating}</span></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openPlayer(id, title, isTv = false) {
            document.getElementById('modalBody').innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="margin:0; color:#fff; font-size: 22px; font-weight: 800; letter-spacing: 0.5px;">🎬 ${title}</h3>
                </div>

                <div id="kinoboxPlayer" class="kinobox_player" style="position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 25px; min-height: 500px; background:#000;">
                    <div style="color: #888; text-align: center; padding-top: 220px;">Загрузка русских серверов...</div>
                </div>

                <div class="reviews-section">
                    <h4 style="margin-top:0; margin-bottom:12px; font-size: 18px;">💬 Оставить отзыв и оценку</h4>
                    <div class="star-rating" id="starContainer">
                        <span class="star active" onclick="setRating(1)">★</span>
                        <span class="star active" onclick="setRating(2)">★</span>
                        <span class="star active" onclick="setRating(3)">★</span>
                        <span class="star active" onclick="setRating(4)">★</span>
                        <span class="star active" onclick="setRating(5)">★</span>
                    </div>
                    <textarea class="review-input" id="reviewText" placeholder="Напишите ваш отзыв о фильме..."></textarea>
                    <button class="review-btn" onclick="submitReview(${id})">Опубликовать отзыв</button>
                    
                    <div class="reviews-list" id="reviewsListContainer"></div>
                </div>
            `;
            
            document.getElementById('modal').style.display = 'flex';
            
            loadKinoboxScript(() => {
                if (window.Kinobox) {
                    new Kinobox('#kinoboxPlayer', {
                        search: { tmdb: id }
                    }).init();
                }
            });

            loadReviews(id);
        }

        function setRating(rating) {
            currentSelectedRating = rating;
            const stars = document.querySelectorAll('#starContainer .star');
            stars.forEach((star, index) => {
                if (index < rating) star.classList.add('active');
                else star.classList.remove('active');
            });
        }

        function submitReview(movieId) {
            const text = document.getElementById('reviewText').value.trim();
            if (!text) return alert('Пожалуйста, напишите текст отзыва!');

            const reviewsKey = 'reviews_' + movieId;
            const existingReviews = JSON.parse(localStorage.getItem(reviewsKey) || '[]');

            existingReviews.unshift({
                rating: currentSelectedRating,
                text: text,
                date: new Date().toLocaleDateString()
            });

            localStorage.setItem(reviewsKey, JSON.stringify(existingReviews));
            document.getElementById('reviewText').value = '';
            loadReviews(movieId);
        }

        function loadReviews(movieId) {
            const reviewsKey = 'reviews_' + movieId;
            const reviews = JSON.parse(localStorage.getItem(reviewsKey) || '[]');
            const container = document.getElementById('reviewsListContainer');

            if (reviews.length === 0) {
                container.innerHTML = '<div style="color:var(--text-gray); font-size:13px;">Пока нет отзывов. Напишите первый комментарий!</div>';
                return;
            }

            container.innerHTML = reviews.map(r => `
                <div class="review-item">
                    <div class="review-item-header">
                        <span>Оценка: ${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                        <span>${r.date}</span>
                    </div>
                    <div>${r.text}</div>
                </div>
            `).join('');
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modalBody').innerHTML = '';
        }

        loadCategory('popular');
    </script>
</body>
</html>
