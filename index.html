<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PES Style — Улучшенная</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Segoe UI', Arial, sans-serif;
        color: #fff;
        overflow: hidden;
        user-select: none;
    }
    #ui {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 960px;
        max-width: 96vw;
        margin-bottom: 12px;
        font-size: 20px;
        font-weight: 700;
    }
    #scoreBoard, #timer {
        background: rgba(0,0,0,0.65);
        padding: 8px 22px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.15);
    }
    canvas {
        background: #1b5e20;
        border: 5px solid #eee;
        border-radius: 8px;
        box-shadow: 0 0 50px rgba(0,0,0,0.8);
        max-width: 96vw;
    }
    .info {
        margin-top: 14px;
        font-size: 13px;
        opacity: 0.75;
        text-align: center;
        line-height: 1.5;
    }
    button {
        margin-top: 16px;
        padding: 11px 32px;
        font-size: 16px;
        background: #d32f2f;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }
    button:hover { background: #b71c1c; transform: scale(1.03); }
</style>
</head>
<body>
    <div id="ui">
        <div id="scoreBoard">Ты 0 : 0 Комп</div>
        <div id="timer">2:00</div>
    </div>
    <canvas id="game" width="960" height="540"></canvas>
    <div class="info">
        WASD / Стрелки — бег &nbsp;|&nbsp; Shift — спринт &nbsp;|&nbsp; Пробел — удар / пас<br>
        <b>Q</b> — переключить игрока &nbsp;|&nbsp; Чем ближе к мячу + спринт = сильнее удар
    </div>
    <button onclick="restart()">Новый матч</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

let keys = {};
let scorePlayer = 0;
let scoreAI = 0;
let timeLeft = 120;
let gameOver = false;
let lastTime = performance.now();
let controlledIndex = 0; // какой игрок сейчас под контролем

// ===== ТВОЯ КОМАНДА (3 игрока) =====
const team = [
    { x: 220, y: H/2,       radius: 15, speed: 3.6, sprint: 5.6, color: '#1565c0', angle: 0 },
    { x: 180, y: H/2 - 100, radius: 14, speed: 3.3, sprint: 5.2, color: '#1976d2', angle: 0 },
    { x: 180, y: H/2 + 100, radius: 14, speed: 3.3, sprint: 5.2, color: '#1976d2', angle: 0 }
];

// ===== МЯЧ =====
const ball = {
    x: W/2, y: H/2,
    radius: 9,
    vx: 0, vy: 0,
    friction: 0.976
};

// ===== ВРАТАРЬ =====
const goalie = {
    x: W - 48, y: H/2,
    radius: 16,
    speed: 3.5,
    color: '#c62828',
    angle: Math.PI
};

// ===== ЗАЩИТНИКИ ИИ =====
const defenders = [
    { x: W - 170, y: H/2 - 95, radius: 14, speed: 2.7, color: '#e53935', angle: Math.PI },
    { x: W - 170, y: H/2 + 95, radius: 14, speed: 2.7, color: '#e53935', angle: Math.PI },
    { x: W - 260, y: H/2,      radius: 14, speed: 2.5, color: '#e53935', angle: Math.PI },
    { x: W - 320, y: H/2 - 50, radius: 13, speed: 2.4, color: '#ef5350', angle: Math.PI }
];

const goalRight = { x: W - 16, y: H/2 - 78, w: 16, h: 156 };
const goalLeft  = { x: 0,      y: H/2 - 78, w: 16, h: 156 };

function restart() {
    scorePlayer = 0;
    scoreAI = 0;
    timeLeft = 120;
    gameOver = false;
    controlledIndex = 0;
    resetPositions();
    updateUI();
}

function resetPositions() {
    team[0].x = 220; team[0].y = H/2;
    team[1].x = 180; team[1].y = H/2 - 100;
    team[2].x = 180; team[2].y = H/2 + 100;
    ball.x = W/2; ball.y = H/2;
    ball.vx = 0; ball.vy = 0;
    goalie.y = H/2;
    defenders[0].y = H/2 - 95;
    defenders[1].y = H/2 + 95;
    defenders[2].y = H/2;
    defenders[3].y = H/2 - 50;
}

function updateUI() {
    document.getElementById('scoreBoard').textContent = `Ты ${scorePlayer} : ${scoreAI} Комп`;
    const m = Math.floor(timeLeft / 60);
    const s = Math.floor(timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('timer').textContent = `${m}:${s}`;
}

window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.code === 'Space') {
        e.preventDefault();
        kickOrPass();
    }
    if (e.key.toLowerCase() === 'q') {
        // Переключение на ближайшего к мячу партнёра
        let best = 0;
        let bestDist = 9999;
        team.forEach((p, i) => {
            const d = Math.hypot(p.x - ball.x, p.y - ball.y);
            if (d < bestDist) {
                bestDist = d;
                best = i;
            }
        });
        controlledIndex = best;
    }
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function kickOrPass() {
    const p = team[controlledIndex];
    const dx = ball.x - p.x;
    const dy = ball.y - p.y;
    const dist = Math.hypot(dx, dy);

    if (dist > p.radius + ball.radius + 32) return;

    // Ищем ближайшего партнёра для паса
    let nearest = null;
    let nearestDist = 999;
    team.forEach((t, i) => {
        if (i === controlledIndex) return;
        const d = Math.hypot(t.x - p.x, t.y - p.y);
        if (d < nearestDist && d < 180) {
            nearestDist = d;
            nearest = t;
        }
    });

    const isSprinting = keys['shift'];
    let power = isSprinting ? 14.5 : 11.5;

    // Если есть партнёр рядом и мы не в штрафной — делаем пас
    if (nearest && p.x < W - 220) {
        const angle = Math.atan2(nearest.y - ball.y, nearest.x - ball.x);
        power = 9.5; // пас мягче
        ball.vx = Math.cos(angle) * power;
        ball.vy = Math.sin(angle) * power;
    } else {
        // Обычный удар в направлении от игрока к мячу + немного в сторону движения
        let angle = Math.atan2(dy, dx);
        ball.vx = Math.cos(angle) * power;
        ball.vy = Math.sin(angle) * power;
    }
}

function moveControlled() {
    const p = team[controlledIndex];
    const spd = keys['shift'] ? p.sprint : p.speed;
    let dx = 0, dy = 0;

    if (keys['arrowup'] || keys['w']) dy -= 1;
    if (keys['arrowdown'] || keys['s']) dy += 1;
    if (keys['arrowleft'] || keys['a']) dx -= 1;
    if (keys['arrowright'] || keys['d']) dx += 1;

    if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        p.x += (dx / len) * spd;
        p.y += (dy / len) * spd;
        p.angle = Math.atan2(dy, dx);
    }

    p.x = Math.max(p.radius + 8, Math.min(W - p.radius - 25, p.x));
    p.y = Math.max(p.radius + 8, Math.min(H - p.radius - 8, p.y));
}

function updateTeammatesAI() {
    team.forEach((p, i) => {
        if (i === controlledIndex) return;

        // Простая поддержка: держаться на разумной позиции относительно мяча и контролируемого
        const controlled = team[controlledIndex];
        let targetX = ball.x - 90;
        let targetY = (i === 1) ? ball.y - 85 : ball.y + 85;

        // Если мяч далеко впереди — подключаться
        if (ball.x > W * 0.55) {
            targetX = ball.x - 50;
            targetY = ball.y + (i === 1 ? -60 : 60);
        }

        const dx = targetX - p.x;
        const dy = targetY - p.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 12) {
            p.x += (dx / dist) * p.speed * 0.85;
            p.y += (dy / dist) * p.speed * 0.85;
            p.angle = Math.atan2(dy, dx);
        }

        p.x = Math.max(40, Math.min(W - 100, p.x));
        p.y = Math.max(30, Math.min(H - 30, p.y));
    });
}

function updateAI() {
    // Вратарь
    const targetY = ball.y + (Math.random() - 0.5) * 10;
    if (goalie.y < targetY - 6) goalie.y += goalie.speed;
    if (goalie.y > targetY + 6) goalie.y -= goalie.speed;
    goalie.y = Math.max(goalRight.y + 22, Math.min(goalRight.y + goalRight.h - 22, goalie.y));
    goalie.angle = Math.atan2(ball.y - goalie.y, ball.x - goalie.x);

    // Защитники
    defenders.forEach((d, i) => {
        let tx, ty;
        if (i === 2) {
            tx = Math.min(ball.x - 40, W - 200);
            ty = ball.y;
        } else if (i === 3) {
            tx = Math.min(ball.x - 70, W - 250);
            ty = ball.y - 40;
        } else {
            tx = W - 190;
            ty = (i === 0) ? ball.y - 80 : ball.y + 80;
        }

        // Давление если мяч близко
        if (ball.x > W * 0.55) {
            tx = ball.x - 55;
            ty = ball.y + (i % 2 === 0 ? -45 : 45);
        }

        const dx = tx - d.x;
        const dy = ty - d.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 8) {
            d.x += (dx / dist) * d.speed;
            d.y += (dy / dist) * d.speed;
            d.angle = Math.atan2(dy, dx);
        }
        d.x = Math.max(W/2 + 30, Math.min(W - 70, d.x));
        d.y = Math.max(25, Math.min(H - 25, d.y));
    });
}

function collideCircle(a, b, pushBall = false) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const dist = Math.hypot(dx, dy);
    const minDist = a.radius + b.radius;
    if (dist < minDist && dist > 0) {
        const angle = Math.atan2(dy, dx);
        const overlap = minDist - dist;
        const push = overlap * 0.5;
        a.x -= Math.cos(angle) * push;
        a.y -= Math.sin(angle) * push;
        b.x += Math.cos(angle) * push;
        b.y += Math.sin(angle) * push;

        if (pushBall && b === ball) {
            const force = 2.2;
            ball.vx += Math.cos(angle) * force;
            ball.vy += Math.sin(angle) * force;
        }
        return true;
    }
    return false;
}

function updateBall() {
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.vx *= ball.friction;
    ball.vy *= ball.friction;

    // Отскоки
    if (ball.y < ball.radius) { ball.y = ball.radius; ball.vy *= -0.82; }
    if (ball.y > H - ball.radius) { ball.y = H - ball.radius; ball.vy *= -0.82; }
    if (ball.x < ball.radius) { ball.x = ball.radius; ball.vx *= -0.75; }

    // Гол тебе
    if (ball.x + ball.radius > goalRight.x &&
        ball.y > goalRight.y && ball.y < goalRight.y + goalRight.h) {
        scorePlayer++;
        updateUI();
        resetPositions();
        return;
    }

    // Гол ИИ (редко, но возможно)
    if (ball.x - ball.radius < 4 &&
        ball.y > goalLeft.y && ball.y < goalLeft.y + goalLeft.h) {
        scoreAI++;
        updateUI();
        resetPositions();
        return;
    }

    if (ball.x > W + 50) resetPositions();
}

function update(dt) {
    if (gameOver) return;

    timeLeft -= dt;
    if (timeLeft <= 0) {
        timeLeft = 0;
        gameOver = true;
        updateUI();
        return;
    }
    updateUI();

    moveControlled();
    updateTeammatesAI();
    updateAI();

    // Коллизии
    const controlled = team[controlledIndex];
    collideCircle(controlled, ball, true);
    team.forEach((p, i) => {
        if (i !== controlledIndex) collideCircle(p, ball, true);
    });
    collideCircle(goalie, ball, true);
    defenders.forEach(d => collideCircle(d, ball, true));

    // Игроки между собой
    for (let i = 0; i < team.length; i++) {
        for (let j = i + 1; j < team.length; j++) {
            collideCircle(team[i], team[j]);
        }
        defenders.forEach(d => collideCircle(team[i], d));
    }

    updateBall();
}

function drawField() {
    ctx.fillStyle = '#2e7d32';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (let i = 0; i < W; i += 80) ctx.fillRect(i, 0, 40, H);

    ctx.strokeStyle = 'rgba(255,255,255,0.75)';
    ctx.lineWidth = 3;

    // Центр
    ctx.beginPath();
    ctx.moveTo(W/2, 0);
    ctx.lineTo(W/2, H);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(W/2, H/2, 75, 0, Math.PI * 2);
    ctx.stroke();

    // Штрафные
    ctx.strokeRect(0, H/2 - 120, 120, 240);
    ctx.strokeRect(W - 120, H/2 - 120, 120, 240);

    // Ворота
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(goalRight.x, goalRight.y, goalRight.w, goalRight.h);
    ctx.fillRect(goalLeft.x, goalLeft.y, goalLeft.w, goalLeft.h);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 4;
    ctx.strokeRect(goalRight.x, goalRight.y, goalRight.w, goalRight.h);
    ctx.strokeRect(goalLeft.x, goalLeft.y, goalLeft.w, goalLeft.h);
}

function drawPlayer(p, isControlled = false) {
    // Тень
    ctx.beginPath();
    ctx.arc(p.x + 2, p.y + 3, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fill();

    // Тело
    ctx.beginPath();
    ctx.arc(p.x, p.y,
