<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoUltra — Премиум Онлайн Кинотеатр</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23e50914%22/><text x=%2250%%22 y=%2254%%22 font-size=%2268%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-family=%22Arial, sans-serif%22>K</text></svg>">
    <style>
        :root {
            --bg-base: #08080a;
            --bg-header: rgba(12, 13, 16, 0.85);
            --card-bg: #13151b;
            --accent: #e50914;
            --accent-hover: #ff0b16;
            --text: #ffffff;
            --text-gray: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text);
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: var(--bg-header);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: var(--accent);
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-gray);
            padding: 9px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.25s ease;
        }

        nav button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        nav button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }

        .search-box input {
            padding: 10px 20px;
            width: 280px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            outline: none;
            font-size: 14px;
            transition: all 0.25s ease;
        }

        .search-box input:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.2);
        }

        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .ad-box {
            margin-bottom: 30px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            min-height: 90px;
        }

        h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease;
            border: 1px solid var(--border);
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            border-color: rgba(229, 9, 20, 0.4);
        }

        .card img {
            width: 100%;
            height: 290px;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover img {
            transform: scale(1.03);
        }

        .card-info {
            padding: 14px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 13px;
            color: var(--text-gray);
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #0e1017;
            width: 950px;
            max-width: 100%;
            border-radius: 16px;
            padding: 30px;
            position: relative;
            max-height: 94vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .close {
            position: absolute;
            top: 18px; right: 22px;
            color: var(--text-gray);
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close:hover { color: white; }

        .servers {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .server-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-gray);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .server-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .server-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .player-frame {
            width: 100%;
            height: 500px;
            background: #000;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="loadCategory('popular')">KinoUltra</div>
        <nav>
            <button class="active" id="btn-popular" onclick="loadCategory('popular')">Популярное</button>
            <button id="btn-russian" onclick="loadCategory('russian')">Русское кино</button>
            <button id="btn-anime" onclick="loadCategory('anime')">Аниме</button>
        </nav>
        <div class="search-box">
            <input type="text" placeholder="Поиск фильмов..." onkeydown="if(event.key==='Enter') searchMovie(this.value)">
        </div>
    </header>

    <div class="container">
        <!-- Нативный баннер Adsterra -->
        <div class="ad-box">
            <script async data-cfasync="false" src="https://bancadeltempoidea.org/21/5e3bed81d838ac1ae8d3b4a0282ef918.js"></script>
            <div id="container-5e3bed81d838ac1ae8d3b4a0282ef918"></div>
        </div>

        <h2 id="sectionTitle">Популярные фильмы</h2>
        <div class="grid" id="movieGrid">Загрузка...</div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
