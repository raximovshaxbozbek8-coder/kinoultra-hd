<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftUltra — Играть в Майнкрафт онлайн бесплатно</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%235c8e32%22/><text x=%2250%%22 y=%2254%%22 font-size=%2268%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-family=%22Arial, sans-serif%22>M</text></svg>">
    
    <style>
        :root {
            --bg: #0f1015;
            --card-bg: #1a1c24;
            --accent: #5c8e32; /* Зеленый цвет травяного блока Minecraft */
            --accent-hover: #487225;
            --text: #ffffff;
            --text-sub: #9ca3af;
            --ad-bg: #1e2029;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #15161d;
            border-bottom: 2px solid var(--accent);
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(92, 142, 50, 0.4);
        }

        .nav-btn {
            background: transparent;
            color: var(--text-sub);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .search-box input {
            padding: 10px 18px;
            width: 240px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #222;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .ad-banner {
            background: var(--ad-bg);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 20px;
            font-size: 13px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 8px 20px rgba(92, 142, 50, 0.3);
            border-color: var(--accent);
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .card-info { padding: 12px; }
        .card-title { font-size: 15px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { font-size: 12px; color: var(--text-sub); margin-top: 6px; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.94);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #181922;
            width: 920px;
            max-width: 95%;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            max-height: 95vh;
            overflow-y: auto;
        }

        .close {
            position: absolute;
            top: 10px; right: 18px;
            color: var(--text-sub);
            font-size: 32px;
            cursor: pointer;
            line-height: 1;
        }

        .close:hover { color: white; }

        .game-frame-container {
            width: 100%;
            height: 540px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .game-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            margin-bottom: 12px;
        }

        .fullscreen-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .fullscreen-btn:hover { background: var(--accent-hover); }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo">⛏️ CraftUltra</div>
            <button class="nav-btn active" onclick="filterCategory('all', this)">Все Майнкрафт Игры</button>
            <button class="nav-btn" onclick="filterCategory('build', this)">🧱 Строительство</button>
            <button class="nav-btn" onclick="filterCategory('parkour', this)">🏃 Паркур</button>
            <button class="nav-btn" onclick="filterCategory('action', this)">⚔️ Выживание</button>
        </div>
        <div class="search-box">
            <input type="text" placeholder="Поиск Майнкрафт игры..." onkeyup="searchGame(this.value)">
        </div>
    </header>

    <div class="container">
        <!-- Рекламный баннер -->
        <div class="ad-banner">
            <span>📢 Рекламный баннер (728x90)</span>
        </div>

        <h2 id="sectionTitle">Бесплатные игры в стиле Minecraft</h2>
        <div class="grid" id="gameGrid"></div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // База HTML5 игр про Майнкрафт
        const games = [
            {
                id: 1,
                title: "Minecraft Classic (Официальный)",
                category: "build",
                categoryName: "Строительство",
                thumb: "https://images.crazygames.com/games/minecraft-classic/thumb-1557416345422.png?auto=format,compress&q=75&cs=strip&ch=DPR",
                url: "https://classic.minecraft.net/"
            },
            {
                id: 2,
                title: "Voxel Craft 3D (Майнкрафт Песочница)",
                category: "build",
                categoryName: "Строительство",
                thumb: "https://images.crazygames.com/bloxdhop-io/20210216162310/bloxdhop-io-cover?auto=format,compress&q=75&cs=strip&ch=DPR",
                url: "https://bloxd.io/"
            },
            {
                id: 3,
                title: "Parkour Block 3D (Майнкрафт Паркур)",
                category: "parkour",
                categoryName: "Паркур",
                thumb: "https://images.crazygames.com/parkour-block-3d/20210719163829/parkour-block-3d-cover?auto=format,compress&q=75&cs=strip&ch=DPR",
                url: "https://html5.gamedistribution.com/f04c601f0161427c9b27fb3d2f974eb1/"
            },
            {
                id: 4,
                title: "Mine Shooter (Майнкрафт Зомби)",
                category: "action",
                categoryName: "Выживание",
                thumb: "https://images.crazygames.com/mine-shooter/20211027151121/mine-shooter-cover?auto=format,compress&q=75&cs=strip&ch=DPR",
                url: "https://html5.gamedistribution.com/a42b1022bebd42db9d259560f85eeecf/"
            },
            {
                id: 5,
                title: "Paper Minecraft 2D (Бумажный Майнкрафт)",
                category: "build",
                categoryName: "Строительство",
                thumb: "https://images.crazygames.com/paper-minecraft/20201124151239/paper-minecraft-cover?auto=format,compress&q=75&cs=strip&ch=DPR",
                url: "https://scratch.mit.edu/projects/10128407/embed"
            },
            {
                id: 6,
                title: "WorldCraft 3D (Строительство миров)",
                category: "build",
                categoryName: "Строительство",
                thumb: "https://images.crazygames.com/world-craft-hd/20201124151240/world-craft-hd-cover?auto=format,compress&q=75&cs=strip&ch=DPR",
                url: "https://html5.gamedistribution.com/db782a2dc34947ba9d16a690ea38a3d3/"
            }
        ];

        function renderGames(list) {
            const grid = document.getElementById('gameGrid');
            if (!list || list.length === 0) {
                grid.innerHTML = "<p>Игры не найдены.</p>";
                return;
            }
            grid.innerHTML = list.map(g => `
                <div class="card" onclick="openGame(${g.id})">
                    <img src="${g.thumb}" alt="${g.title}">
                    <div class="card-info">
                        <div class="card-title">${g.title}</div>
                        <div class="card-meta">Категория: ${g.categoryName}</div>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (cat === 'all') {
                renderGames(games);
            } else {
                const filtered = games.filter(g => g.category === cat);
                renderGames(filtered);
            }
        }

        function searchGame(query) {
            const q = query.toLowerCase().trim();
            const filtered = games.filter(g => g.title.toLowerCase().includes(q));
            renderGames(filtered);
        }

        function openGame(id) {
            const g = games.find(item => item.id === id);
            if (!g) return;

            document.getElementById('modalBody').innerHTML = `
                <h3 style="margin-top:0; margin-bottom:10px;">${g.title}</h3>
                
                <div class="game-frame-container" id="gameContainer">
                    <iframe id="gameIframe" src="${g.url}" allowfullscreen></iframe>
                </div>

                <div class="game-controls">
                    <span style="color:#9ca3af; font-size:13px;">Управление: WASD + Мышь (кликни в окно игры для включения управления)</span>
                    <button class="fullscreen-btn" onclick="toggleFullscreen()">На весь экран ⛶</button>
                </div>

                <div class="ad-banner" style="margin-top:10px; margin-bottom:0;">
                    <span>📺 Рекламный баннер под игрой</span>
                </div>
            `;

            document.getElementById('modal').style.display = 'flex';
        }

        function toggleFullscreen() {
            const container = document.getElementById('gameContainer');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => alert("Не удалось открыть на весь экран"));
            } else {
                document.exitFullscreen();
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modalBody').innerHTML = '';
        }

        renderGames(games);
    </script>
</body>
</html>
