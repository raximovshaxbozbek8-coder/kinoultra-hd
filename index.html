<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoUltra — Смотреть фильмы онлайн</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e50914'><path d='M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z'/></svg>">
    
    <style>
        :root {
            --bg: #0f1015;
            --card-bg: #1a1c24;
            --accent: #e50914;
            --accent-hover: #b20710;
            --text: #ffffff;
            --text-sub: #9ca3af;
            --ad-bg: #1e2029;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #15161d;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: var(--accent);
            cursor: pointer;
            letter-spacing: 1px;
        }

        .search-box input {
            padding: 10px 18px;
            width: 280px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #222;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            flex: 1;
            width: 100%;
        }

        .ad-banner {
            background: var(--ad-bg);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 20px;
            font-size: 13px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .card:hover { transform: translateY(-5px); }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .card-info { padding: 10px; }
        .card-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { font-size: 12px; color: var(--text-sub); margin-top: 5px; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #181922;
            width: 880px;
            max-width: 95%;
            border-radius: 12px;
            padding: 24px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close {
            position: absolute;
            top: 10px; right: 18px;
            color: var(--text-sub);
            font-size: 32px;
            cursor: pointer;
            line-height: 1;
        }

        .close:hover { color: white; }

        .movie-info-box {
            display: flex;
            gap: 20px;
        }

        .modal-poster {
            width: 160px;
            height: 240px;
            object-fit: cover;
            border-radius: 8px;
        }

        .modal-details {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .play-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-top: 15px;
        }

        .play-btn:hover { background: var(--accent-hover); }

        iframe {
            width: 100%;
            height: 480px;
            border: none;
            border-radius: 8px;
            background: #000;
        }
    </style>

    <!-- Твоя рекламная сеть -->
    <script data-cfasync="false" src="https://aarems.org/1/fc63adad21599d5019e3641c3dda462d"></script>
</head>
<body>

    <header>
        <div class="logo" onclick="loadMovies()">KinoUltra</div>
        <div class="search-box">
            <input type="text" placeholder="Поиск фильмов..." onkeydown="if(event.key==='Enter') searchMovie(this.value)">
        </div>
    </header>

    <div class="container">
        <!-- БЛОК РЕКЛАМЫ #1: Верхний баннер -->
        <div class="ad-banner" id="topAdSlot">
            <span>📢 Рекламный блок (728x90) — Вставьте ваш баннерный код сюда</span>
        </div>

        <h2 id="catalogTitle">Популярные фильмы</h2>
        <div class="grid" id="movieGrid">Загрузка каталога...</div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const API_KEY = '3fd2be6f0c70a2a598f084ddfb75487c';
        let moviesList = [];

        async function loadMovies() {
            document.getElementById('catalogTitle').innerText = "Популярные фильмы";
            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=ru-RU`);
                const data = await res.json();
                moviesList = data.results || [];
                render(moviesList);
            } catch (e) {
                document.getElementById('movieGrid').innerText = "Не удалось загрузить каталог фильмов.";
            }
        }

        async function searchMovie(q) {
            if(!q) return loadMovies();
            document.getElementById('catalogTitle').innerText = `Результаты поиска: "${q}"`;
            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&language=ru-RU&query=${encodeURIComponent(q)}`);
                const data = await res.json();
                moviesList = data.results || [];
                render(moviesList);
            } catch (e) {
                document.getElementById('movieGrid').innerText = "Ошибка при поиске.";
            }
        }

        function render(list) {
            const grid = document.getElementById('movieGrid');
            if (!list || list.length === 0) {
                grid.innerHTML = '<div>Ничего не найдено</div>';
                return;
            }
            grid.innerHTML = list.map(m => `
                <div class="card" onclick="openInfo(${m.id})">
                    <img src="${m.poster_path ? 'https://image.tmdb.org/t/p/w500' + m.poster_path : 'https://via.placeholder.com/300x450?text=Нет+обложки'}" alt="${m.title}">
                    <div class="card-info">
                        <div class="card-title">${m.title}</div>
                        <div class="card-meta">${(m.release_date||'').split('-')[0]} • ★ ${m.vote_average ? m.vote_average.toFixed(1) : '0'}</div>
                    </div>
                </div>
            `).join('');
        }

        function openInfo(id) {
            const m = moviesList.find(item => item.id === id);
            if (!m) return;

            const poster = m.poster_path ? 'https://image.tmdb.org/t/p/w500' + m.poster_path : 'https://via.placeholder.com/300x450?text=Нет+обложки';
            const title = m.title;
            const desc = m.overview || "Описание фильма пока отсутствует.";

            document.getElementById('modalBody').innerHTML = `
                <h2 style="margin-top:0;">${title}</h2>
                <div class="movie-info-box">
                    <img class="modal-poster" src="${poster}" alt="${title}">
                    <div class="modal-details">
                        <p style="color:#9ca3af; line-height:1.4;">${desc}</p>
                        <button class="play-btn" onclick="startMovie(${m.id}, '${title.replace(/'/g, "")}')">▶ Смотреть фильм</button>
                    </div>
                </div>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        function startMovie(id, title) {
            document.getElementById('modalBody').innerHTML = `
                <h3 style="margin-top:0; margin-bottom:12px;">${title}</h3>
                <iframe src="https://vidlink.pro/movie/${id}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
                
                <!-- БЛОК РЕКЛАМЫ #2: Баннер под видеоплеером -->
                <div class="ad-banner" style="margin-top:15px; margin-bottom:0;">
                    <span>🎰 Рекламный баннер спонсора / промокоды (под плеером)</span>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modalBody').innerHTML = '';
        }

        loadMovies();
    </script>
</body>
</html>
