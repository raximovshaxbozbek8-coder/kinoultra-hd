<head>

    <meta charset="UTF-8">

    <!-- Иконка сайта K -->

    <style>
        :root {
            --bg: #0f1015;
            --card-bg: #1a1c24;
            --accent: #e50914;
            --accent-hover: #b20710;
            --text: #ffffff;
            --text-sub: #9ca3af;
            --ad-bg: #1e2029;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #15161d;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
            cursor: pointer;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        nav button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        nav button:hover, nav button.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .search-box input {
            padding: 10px 18px;
            width: 260px;
            border-radius: 20px;
            border: 1px solid #333;
            background: #222;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .ad-banner {
            background: var(--ad-bg);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 20px;
            font-size: 13px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .card:hover { transform: translateY(-5px); }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .card-info { padding: 10px; }
        .card-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { font-size: 12px; color: var(--text-sub); margin-top: 5px; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #181922;
            width: 880px;
            max-width: 95%;
            border-radius: 12px;
            padding: 24px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close {
            position: absolute;
            top: 10px; right: 18px;
            color: var(--text-sub);
            font-size: 32px;
            cursor: pointer;
            line-height: 1;
        }

        .close:hover { color: white; }

        .movie-info-box {
            display: flex;
            gap: 20px;
        }

        .modal-poster {
            width: 160px;
            height: 240px;
            object-fit: cover;
            border-radius: 8px;
        }

        .modal-details {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .play-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-top: 15px;
        }

        .play-btn:hover { background: var(--accent-hover); }

        .servers-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .server-btn {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            font-weight: bold;
        }

        .server-btn.active, .server-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        iframe {
            width: 100%;
            height: 480px;
            border: none;
            border-radius: 8px;
            background: #000;
        }

        .reviews-section {
            margin-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }
        .star-rating {
            display: flex;
            gap: 5px;
            font-size: 24px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .star { color: #555; transition: color 0.2s; }
        .star.active { color: #f59e0b; }
        .review-input {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #333;
            border-radius: 6px;
            color: white;
            resize: vertical;
            min-height: 60px;
            margin-bottom: 10px;
            outline: none;
        }
        .review-btn {
            background: #333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .review-btn:hover { background: var(--accent); }
        .reviews-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .review-item {
            background: #1e2029;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
        }
        .review-item-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
    </style>

    <!-- Рекламный скрипт #1 -->

</head>
<body>

        <div class="modal-content">
