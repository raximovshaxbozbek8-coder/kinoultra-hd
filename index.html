    <style>
        * {

        body {

            color: #ffffff;
        }
        header {
            background-color: #1f2833;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #66fcf1;
        }
        /* Блок логотипа с иконкой К */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: #66fcf1;
            color: #0b0c10;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: 900;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.6);
        }
        .logo-text {
            font-size: 24px;
            font-weight: bold;
            color: #66fcf1;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        nav a {
            color: #c5c6c7;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
            transition: 0.3s;
        }
        nav a:hover {
            color: #66fcf1;
        }
        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .player-section {
            background-color: #1f2833;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 40px;
        }
        .player-title {
            font-size: 24px;
            margin-bottom: 10px;
            color: #66fcf1;
        }
        .player-subtitle {
            font-size: 16px;
            color: #c5c6c7;
            margin-bottom: 20px;
        }
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 16 / 9;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .controls-wrapper {
            background: #0b0c10;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #45a29e;
            display: none;
        }
        .selector-title {
            font-size: 14px;
            color: #45a29e;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .season-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn-season {
            background: #1f2833;
            color: #fff;
            border: 1px solid #45a29e;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-season.active, .btn-season:hover {
            background: #66fcf1;
            color: #0b0c10;
            border-color: #66fcf1;
        }
        .episodes-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }
        .btn-episode {
            background: #1f2833;
            color: #c5c6c7;
            border: 1px solid #2f3b4c;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }
        .btn-episode.active, .btn-episode:hover {
            border-color: #66fcf1;
            color: #66fcf1;
            background: #243447;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
        }
        .movie-card {
            background-color: #1f2833;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid #45a29e;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(102, 252, 241, 0.3);
        }
        .movie-poster {
            width: 100%;
            height: 280px;
            background-color: #0b0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #66fcf1;
            font-size: 64px;
        }
        .movie-info {
            padding: 15px;
            background: #1f2833;
        }
        .movie-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffffff;
        }
        .movie-genre {
            font-size: 13px;
            color: #45a29e;
        }
        .badge {
            background: #ff4757;
            color: #fff;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 5px;
        }
        footer {
            text-align: center;
            padding: 30px;
            color: #c5c6c7;
            font-size: 14px;
            border-top: 1px solid #1f2833;
            margin-top: 50px;
        }
    </style>
</head>

// Автоматическая генерация карточек
const grid = document.getElementById('catalog-grid');
contentData.forEach(item => {
const card = document.createElement('div');
card.className = 'movie-card';
card.onclick = () => selectContent(item.id);
const badgeHtml = item.type === 'anime' ? 'АНИМЕ / РУС' : 'ФИЛЬМ';
card.innerHTML = <div class="movie-poster">${item.icon}</div> <div class="movie-info"> ${badgeHtml} <div class="movie-name">${item.title}</div> <div class="movie-genre">${item.genre}</div> </div>;
grid.appendChild(card);
});
function selectContent(id) {
const item = contentData.find(x => x.id === id);
currentActiveItem = item;
document.getElementById('current-title').innerText = item.title;
document.getElementById('series-controls').style.display = 'block';
const seasonContainer = document.getElementById('season-container');
seasonContainer.innerHTML = '';
const seasonsList = Object.keys(item.seasons);
seasonsList.forEach((seasonName, index) => {
const btn = document.createElement('button');
btn.className = btn-season ${index === 0 ? 'active' : ''};
btn.innerText = seasonName;
btn.onclick = () => {
document.querySelectorAll('.btn-season').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
loadEpisodes(seasonName);
};
seasonContainer.appendChild(btn);
});
loadEpisodes(seasonsList[0]);
playVideo(item.seasons[seasonsList[0]][0].url, seasonsList[0], item.seasons[seasonsList[0]][0].name);
}
function loadEpisodes(seasonName) {
const episodeContainer = document.getElementById('episode-container');
episodeContainer.innerHTML = '';
const episodes = currentActiveItem.seasons[seasonName];
episodes.forEach((ep, index) => {
const btn = document.createElement('div');
btn.className = btn-episode ${index === 0 ? 'active' : ''};
btn.innerText = ep.name;
btn.onclick = () => {
document.querySelectorAll('.btn-episode').forEach(b => b.classList.remove('active'));
btn.classList.add('active');
playVideo(ep.url, seasonName, ep.name);
};
episodeContainer.appendChild(btn);
});
}
function playVideo(url, season, episode) {
document.getElementById('current-episode-title').innerText = Текущий выбор: ${season} — ${episode} (Русская профессиональная озвучка);
const player = document.getElementById('video-player');
const source = document.getElementById('video-source');
source.src = url;
player.load();
player.play().catch(e => console.log("Плеер готов к воспроизведению."));
window.scrollTo({top: 0, behavior: 'smooth'});
}
