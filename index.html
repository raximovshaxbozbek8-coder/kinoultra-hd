<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кино Ультра — Премиум Кинобаза</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
        }
        header {
            background-color: #0a0a0a;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e50914;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.15);
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 42px;
            height: 42px;
            background: #e50914;
            color: #ffffff;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: 900;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.6);
        }
        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .search-container {
            flex-grow: 1;
            max-width: 450px;
            margin: 0 20px;
        }
        .search-input {
            width: 100%;
            background: #141414;
            border: 1px solid #262626;
            color: #fff;
            padding: 11px 15px;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .search-input:focus {
            border-color: #e50914;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.3);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .copy-btn {
            background: transparent;
            color: #e50914;
            border: 2px solid #e50914;
            padding: 8px 18px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            text-transform: uppercase;
        }
        .copy-btn:hover {
            background: #e50914;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
        }
        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .player-section {
            background-color: #0a0a0a;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #1f1f1f;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 50px;
        }
        .player-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .player-subtitle {
            font-size: 14px;
            color: #999999;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 16 / 9;
            margin-bottom: 25px;
            border: 1px solid #262626;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .section-heading {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #ffffff;
            border-left: 4px solid #e50914;
            padding-left: 12px;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }
        .movie-card {
            background-color: #0a0a0a;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #1f1f1f;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .movie-card:hover {
            transform: scale(1.04);
            border-color: #e50914;
            box-shadow: 0 10px 20px rgba(229, 9, 20, 0.2);
        }
        .movie-poster {
            width: 100%;
            height: 280px;
            background-size: cover;
            background-position: center;
            background-color: #141414;
            border-bottom: 1px solid #1f1f1f;
        }
        .movie-info {
            padding: 12px;
            background: #0a0a0a;
        }
        .movie-name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-date {
            font-size: 12px;
            color: #777777;
        }
        .status-msg {
            color: #888;
            font-size: 16px;
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 0;
        }
        footer {
            text-align: center;
            padding: 40px;
            color: #555555;
            font-size: 13px;
            border-top: 1px solid #1f1f1f;
            margin-top: 80px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">К</div>
            <div class="logo-text">Кино Ультра</div>
        </div>

        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Введите название фильма (например: Человек-паук)..." oninput="debounceSearch()">
        </div>

        <div class="header-actions">
            <button class="copy-btn" onclick="copySourceCode()" id="copyButton">Скопировать код</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Секция плеера -->
        <section class="player-section">
            <h2 class="player-title" id="current-title">Найдите любой фильм через поиск выше</h2>
            <div class="player-subtitle" id="current-movie-desc">Вся мировая база кино теперь доступна на вашем сайте.</div>
            
            <div class="video-wrapper">
                <video id="video-player" controls poster="">
                    <source id="video-source" src="" type="video/mp4">
                    Ваш браузер не поддерживает встроенный плеер.
                </video>
            </div>
        </section>

        <!-- Каталог -->
        <h2 class="section-heading" id="grid-title">Популярные фильмы сейчас</h2>
        <section class="movies-grid" id="catalog-grid">
            <div class="status-msg">Загрузка трендов из кинобазы...</div>
        </section>
    </div>

    <footer>
        &copy; 2026 Кино Ультра. Поиск работает на базе технологий TMDb API.
    </footer>

    <script>
        // ТВОЙ ЛИЧНЫЙ API-КЛЮЧ УСПЕШНО ИНТЕГРИРОВАН СЮДА:
        const TMDB_API_KEY = "f13df4519e4be31e6c1c1c5973055a04"; 
        
        let searchTimeout;

        function copySourceCode() {
            const fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            navigator.clipboard.writeText(fullHtml).then(() => {
                const btn = document.getElementById('copyButton');
                btn.innerHTML = 'Код скопирован!';
                btn.style.background = '#e50914';
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.innerHTML = 'Скопировать код';
                    btn.style.background = 'transparent';
                    btn.style.color = '#e50914';
                }, 2000);
            }).catch(err => alert('Ошибка копирования.'));
        }

        async function fetchTrendingMovies() {
            try {
                const response = await fetch(`https://themoviedb.org{TMDB_API_KEY}&language=ru-RU`);
                const data = await response.json();
                renderMovies(data.results);
            } catch (error) {
                console.error("Ошибка получения трендов:", error);
            }
        }

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(searchTMDB, 600);
        }

        async function searchTMDB() {
            const query = document.getElementById('searchInput').value.trim();
            const gridTitle = document.getElementById('grid-title');
            
            if (query === '') {
                gridTitle.innerText = "Популярные фильмы сейчас";
                fetchTrendingMovies();
                return;
            }

            gridTitle.innerText = `Результаты поиска по запросу "${query}"`;
            
            try {
                const response = await fetch(`https://themoviedb.org{TMDB_API_KEY}&query=${encodeURIComponent(query)}&language=ru-RU&page=1`);
                const data = await response.json();
                renderMovies(data.results);
            } catch (error) {
                console.error("Ошибка поиска:", error);
            }
        }

        function renderMovies(movies) {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';

            if (!movies || movies.length === 0) {
