<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Quiz for School (1-9 Grades)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 600px;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1, h2 {
      margin-bottom: 20px;
      color: #1e293b;
    }

    p.subtitle {
      color: #64748b;
      margin-bottom: 25px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 15px 20px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .btn:hover {
      background: #4338ca;
      transform: translateY(-3px);
    }

    .btn-count {
      background: #0ea5e9;
    }

    .btn-count:hover {
      background: #0284c7;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .option-btn {
      background: #f1f5f9;
      color: #1e293b;
      border: 2px solid #cbd5e1;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }

    .hidden {
      display: none;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 5px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      background: #22c55e;
      width: 0%;
      transition: width 0.3s;
    }

    .score-badge {
      font-size: 48px;
      font-weight: bold;
      color: #4f46e5;
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- СТЕП 1: Выбор класса -->
    <div id="step-grade">
      <h1>English Quiz Master 🇬🇧</h1>
      <p class="subtitle">Выберите класс для проведения теста:</p>
      <div class="grid-container">
        <button class="btn" onclick="selectGrade(1)">1 Grade</button>
        <button class="btn" onclick="selectGrade(2)">2 Grade</button>
        <button class="btn" onclick="selectGrade(3)">3 Grade</button>
        <button class="btn" onclick="selectGrade(4)">4 Grade</button>
        <button class="btn" onclick="selectGrade(5)">5 Grade</button>
        <button class="btn" onclick="selectGrade(6)">6 Grade</button>
        <button class="btn" onclick="selectGrade(7)">7 Grade</button>
        <button class="btn" onclick="selectGrade(8)">8 Grade</button>
        <button class="btn" onclick="selectGrade(9)">9 Grade</button>
      </div>
    </div>

    <!-- СТЕП 2: Выбор количества вопросов -->
    <div id="step-count" class="hidden">
      <h2 id="selected-grade-title">Класс выбран</h2>
      <p class="subtitle">Выберите количество вопросов:</p>
      <div class="grid-container" style="grid-template-columns: repeat(2, 1fr);">
        <button class="btn btn-count" onclick="startQuiz(10)">10 вопросов</button>
        <button class="btn btn-count" onclick="startQuiz(15)">15 вопросов</button>
        <button class="btn btn-count" onclick="startQuiz(20)">20 вопросов</button>
        <button class="btn btn-count" onclick="startQuiz(25)">25 вопросов</button>
      </div>
      <button class="option-btn" style="margin-top: 25px; text-align: center;" onclick="resetQuiz()">← Назад к выбору класса</button>
    </div>

    <!-- СТЕП 3: Прохождение теста -->
    <div id="step-quiz" class="hidden">
      <div class="progress-bar">
        <div id="progress" class="progress"></div>
      </div>
      <p style="color: #64748b; font-size: 14px;" id="question-number">Вопрос 1 из X</p>
      <h2 id="question-text" style="margin-top: 10px;">Question goes here?</h2>
      <div class="options-grid" id="options-container">
        <!-- Варианты ответов генерируются в JS -->
      </div>
    </div>

    <!-- СТЕП 4: Результат -->
    <div id="step-result" class="hidden">
      <h2>Тест завершен! 🎉</h2>
      <p class="subtitle">Ваш результат:</p>
      <div id="final-score" class="score-badge">0 / 0</div>
      <p id="result-message" style="margin-bottom: 20px; font-weight: bold;"></p>
      <button class="btn" onclick="resetQuiz()">Начать заново</button>
    </div>
  </div>

  <script>
    // Пример базы данных вопросов (здесь можно расширять вопросы для всех классов)
    const questionsDatabase = {
      1: [
        { q: "What color is a lemon?", options: ["Red", "Blue", "Yellow", "Green"], answer: 2 },
        { q: "Choose the correct word: A ___ (кошка)", options: ["Dog", "Cat", "Bird", "Fish"], answer: 1 },
        { q: "How do you say 'Яблоко' in English?", options: ["Banana", "Apple", "Orange", "Grape"], answer: 1 }
      ],
      5: [
        { q: "She ___ to school every day.", options: ["go", "goes", "going", "went"], answer: 1 },
        { q: "Yesterday we ___ a great film.", options: ["watch", "watches", "watched", "will watch"], answer: 2 },
        { q: "Which word is an adjective?", options: ["Quickly", "Run", "Beautiful", "Happiness"], answer: 2 }
      ],
      9: [
        { q: "If I ___ more time, I would travel the world.", options: ["have", "had", "will have", "would have"], answer: 1 },
        { q: "By next month, they ___ the project.", options: ["finish", "will finish", "will have finished", "finished"], answer: 2 },
        { q: "Choose the correct synonym for 'Enormous':", options: ["Tiny", "Huge", "Fast", "Difficult"], answer: 1 }
      ]
    };

    let selectedGrade = 1;
    let selectedCount = 10;
    let currentQuestionIndex = 0;
    let score = 0;
    let activeQuestions = [];

    function selectGrade(grade) {
      selectedGrade = grade;
      document.getElementById('selected-grade-title').innerText = `${grade} Grade selected`;
      document.getElementById('step-grade').classList.add('hidden');
      document.getElementById('step-count').classList.remove('hidden');
    }

    function startQuiz(count) {
      selectedCount = count;
      currentQuestionIndex = 0;
      score = 0;

      // Получаем вопросы для класса (если нет вопросов для класса, берём 5 класс как дефолт)
      let pool = questionsDatabase[selectedGrade] || questionsDatabase[5];
      
      // Дублируем/подготавливаем вопросы под выбранное количество
      activeQuestions = [];
      for (let i = 0; i < selectedCount; i++) {
        activeQuestions.push(pool[i % pool.length]);
      }

      document.getElementById('step-count').classList.add('hidden');
      document.getElementById('step-quiz').classList.remove('hidden');
      showQuestion();
    }

    function showQuestion() {
      const q = activeQuestions[currentQuestionIndex];
      document.getElementById('question-number').innerText = `Question ${currentQuestionIndex + 1} of ${selectedCount}`;
      document.getElementById('question-text').innerText = q.q;
      
      // Обновляем шкалу прогресса
      const progressPercent = ((currentQuestionIndex) / selectedCount) * 100;
      document.getElementById('progress').style.width = `${progressPercent}%`;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${String.fromCharCode(65 + index)}) ${opt}`;
        btn.onclick = () => checkAnswer(index);
        container.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex) {
      const q = activeQuestions[currentQuestionIndex];
      if (selectedIndex === q.answer) {
        score++;
      }

      currentQuestionIndex++;
      if (currentQuestionIndex < selectedCount) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('step-quiz').classList.add('hidden');
      document.getElementById('step-result').classList.remove('hidden');
      document.getElementById('final-score').innerText = `${score} / ${selectedCount}`;

      const percentage = (score / selectedCount) * 100;
      let msg = "";
      if (percentage >= 90) msg = "Excellent job! 🏆";
      else if (percentage >= 70) msg = "Good result! 👍";
      else msg = "Keep practicing! 📚";

      document.getElementById('result-message').innerText = msg;
    }

    function resetQuiz() {
      document.getElementById('step-count').classList.add('hidden');
      document.getElementById('step-quiz').classList.add('hidden');
      document.getElementById('step-result').classList.add('hidden');
      document.getElementById('step-grade').classList.remove('hidden');
    }
  </script>
</body>
</html>
