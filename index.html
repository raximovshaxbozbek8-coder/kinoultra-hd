<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinoUltra — Премиум Онлайн Кинотеатр</title>
    <!-- Возвращаем иконку сайта -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23e50914'/%3E%3Ctext x='50%25' y='54%25' font-size='68' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central' font-family='Arial, sans-serif'%3EK%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg-base: #08080a;
            --bg-header: rgba(12, 13, 16, 0.85);
            --card-bg: #13151b;
            --accent: #e50914;
            --accent-hover: #ff0b16;
            --text: #ffffff;
            --text-gray: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text);
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: var(--bg-header);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            color: var(--accent);
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-gray);
            padding: 9px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.25s ease;
        }

        nav button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        nav button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }

        .search-box input {
            padding: 10px 20px;
            width: 280px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            outline: none;
            font-size: 14px;
            transition: all 0.25s ease;
        }

        .search-box input:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.2);
        }

        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .ad-box {
            margin-bottom: 25px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease;
            border: 1px solid var(--border);
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            border-color: rgba(229, 9, 20, 0.4);
        }

        .card img {
            width: 100%;
            height: 290px;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover img {
            transform: scale(1.03);
        }

        .card-info {
            padding: 14px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 13px;
            color: var(--text-gray);
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #0e1017;
            width: 980px;
            max-width: 100%;
            border-radius: 16px;
            padding: 25px;
            position: relative;
            max-height: 94vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }

        .close {
            position: absolute;
            top: 18px; right: 22px;
            color: var(--text-gray);
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s;
            z-index: 10;
        }

        .close:hover { color: white; }

        .player-frame {
            width: 100%;
            height: 500px;
            background: #000;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .reviews-section {
            margin-top: 25px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
        .star-rating {
            display: flex;
            gap: 6px;
            font-size: 24px;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .star { color: #444; transition: color 0.2s; }
        .star.active { color: #f59e0b; }
        .review-input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            resize: vertical;
            min-height: 70px;
            margin-bottom: 12px;
            outline: none;
            font-family: inherit;
        }
        .review-input:focus { border-color: var(--accent); }
        .review-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .review-btn:hover { background: var(--accent-hover); }
        .reviews-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .review-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
        }
        .review-item-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-gray);
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="loadCategory('popular')">KinoUltra</div>
        <nav>
            <button class="active" id="btn-popular" onclick="loadCategory('popular')">🔥 Популярное</button>
            <button id="btn-russian" onclick="loadCategory('russian')">🇷🇺 Русское кино</button>
            <button id="btn-anime" onclick="loadCategory('anime')">⛩️ Аниме</button>
        </nav>
        <div class="search-box">
            <input type="text" placeholder="Поиск фильмов и аниме..." onkeydown="if(event.key==='Enter') searchMovie(this.value)">
        </div>
    </header>

    <div class="container">
        <!-- Блок под рекламу -->
        <div class="ad-box" id="mainAdContainer">
            <div id="container-5e3bed81d838ac1ae8d3b4a0282ef918"></div>
        </div>

        <h2 id="sectionTitle">🔥 Популярные фильмы</h2>
        <div class="grid" id="movieGrid">Загрузка...</div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
