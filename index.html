<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestUz AI — ИИ Помощник с ДЗ и Ответы (5-11 класс)</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232563eb%22/><text x=%2250%%22 y=%2254%%22 font-size=%2268%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 font-family=%22Arial, sans-serif%22>T</text></svg>">
    
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text: #ffffff;
            --text-sub: #94a3b8;
            --ad-bg: #090d16;
            --success: #16a34a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #1e293b;
            border-bottom: 2px solid var(--accent);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
            cursor: pointer;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
            width: 100%;
            flex: 1;
        }

        .ad-banner {
            background: var(--ad-bg);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            color: var(--text-sub);
            margin-bottom: 20px;
            font-size: 13px;
        }

        .panel {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .class-btn {
            background: #334155;
            color: white;
            border: 2px solid transparent;
            padding: 10px 5px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .class-btn:hover, .class-btn.active {
            background: var(--accent);
            border-color: #38bdf8;
        }

        .upload-box {
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            background: rgba(56, 189, 248, 0.05);
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 15px;
            resize: vertical;
            outline: none;
            margin-bottom: 15px;
        }

        .solve-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .solve-btn:hover { background: #15803d; }

        .result-box {
            display: none;
            background: #0f172a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--accent);
            line-height: 1.6;
        }

        .preview-img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ TestUz AI — Помощник ДЗ</div>
    </header>

    <div class="container">
        <!-- Баннер рекламы -->
        <div class="ad-banner">
            <span>📢 Рекламный блок (728x90)</span>
        </div>

        <div class="panel">
            <div class="section-title">1. Выберите класс:</div>
            <div class="class-grid">
                <button class="class-btn active" onclick="setClass(5, this)">5 класс</button>
                <button class="class-btn" onclick="setClass(6, this)">6 класс</button>
                <button class="class-btn" onclick="setClass(7, this)">7 класс</button>
                <button class="class-btn" onclick="setClass(8, this)">8 класс</button>
                <button class="class-btn" onclick="setClass(9, this)">9 класс</button>
                <button class="class-btn" onclick="setClass(10, this)">10 класс</button>
                <button class="class-btn" onclick="setClass(11, this)">11 класс</button>
            </div>

            <div class="section-title">2. Загрузите фото задания или введите текст:</div>
            
            <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                📷 <b>Нажмите, чтобы загрузить фото задачи / ВПР</b>
                <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFile(this)">
                <br>
                <img id="imgPreview" class="preview-img" alt="Предпросмотр">
            </div>

            <textarea id="taskText" placeholder="Напишите текст задачи или вопрос к ИИ..."></textarea>

            <button class="solve-btn" onclick="getSolution()">✨ Получить ответ и решение от ИИ</button>
        </div>

        <div class="panel result-box" id="resultBox">
            <h3 style="margin-top:0; color:#38bdf8;">Решение ИИ:</h3>
            <div id="solutionText">Загрузка решения...</div>
        </div>

        <!-- Баннер рекламы снизу -->
        <div class="ad-banner">
            <span>📺 Рекламный баннер под ответом</span>
        </div>
    </div>

    <script>
        let currentClass = 5;

        function setClass(num, btn) {
            currentClass = num;
            document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function handleFile(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('imgPreview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function getSolution() {
            const text = document.getElementById('taskText').value.trim();
            const resultBox = document.getElementById('resultBox');
            const solutionText = document.getElementById('solutionText');

            resultBox.style.display = 'block';
            solutionText.innerHTML = "⏳ ИИ анализирует задачу для " + currentClass + " класса, подождите...";

            setTimeout(() => {
                solutionText.innerHTML = `
                    <b>Ответ для ${currentClass} класса:</b><br><br>
                    1. <b>Краткий ответ:</b> Вариант А / x = 15<br>
                    2. <b>Пошаговое решение:</b><br>
                    • Шаг 1: Разберем условие задания.<br>
                    • Шаг 2: Применим формулу и выполним вычисления.<br>
                    • Шаг 3: Получаем итоговый результат.<br><br>
                    <i>💡 Сохраните ответ, чтобы использовать при проверке!</i>
                `;
            }, 1500);
        }
    </script>
</body>
</html>
